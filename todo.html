<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff3b0">
<title>내 할일</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "맑은 고딕", "Malgun Gothic", -apple-system, sans-serif;
    background: #6b6456;
    display: flex; justify-content: center;
    min-height: 100vh;
  }
  .note {
    width: 360px; max-width: 100vw;
    margin: 18px;
    background: #fff7c2;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    position: relative;
    padding: 22px 18px 18px;
    background-image: linear-gradient(#fff7c2 29px, #f3e89a 30px);
    background-size: 100% 30px;
    align-self: flex-start;
  }
  /* 노트 위 테이프 */
  .note::before {
    content: ""; position: absolute; top: -12px; left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 110px; height: 26px;
    background: rgba(255,255,255,.45);
    border: 1px dashed rgba(0,0,0,.12);
  }
  h1 {
    font-size: 19px; margin: 0 0 2px; color: #4a431f;
    display: flex; align-items: center; gap: 8px;
  }
  .edit-btn {
    margin-left: auto; border: none; background: #e9d873; color: #5b5012;
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 5px 11px; border-radius: 14px; cursor: pointer;
  }
  .editing .edit-btn { background: #7bc47f; color: #163d18; }
  .date { font-size: 12px; color: #8a7f4a; margin-bottom: 12px; }
  .who {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px; font-size: 13px; color: #6b6029;
  }
  select {
    font-size: 14px; font-weight: 700; color: #4a431f;
    border: none; border-bottom: 1.5px solid #c9b94e;
    background: transparent; padding: 2px 4px; font-family: inherit;
  }
  .sec-title {
    font-size: 13px; font-weight: 800; color: #7a6a1f;
    margin: 16px 0 4px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 6px;
  }
  .sec-title.toggle { cursor: pointer; user-select: none; }
  .sec-title .arrow { font-size: 11px; transition: transform .2s; }
  .sec-title.open .arrow { transform: rotate(90deg); }
  ul { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  ul.collapsed { display: none; }
  li {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 6px 2px; line-height: 1.5; min-height: 30px;
    border-bottom: 1px dotted rgba(0,0,0,.06);
    cursor: pointer; transition: opacity .25s, transform .25s;
  }
  li .box {
    flex: 0 0 20px; width: 20px; height: 20px; margin-top: 2px;
    border: 2px solid #b9a83e; border-radius: 5px; background: #fffef0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #2e7d32; font-weight: 900;
  }
  li .txt { flex: 1; font-size: 14.5px; color: #3d3713; }
  li .cyc {
    flex: 0 0 auto; font-size: 10.5px; color: #fff;
    background: #c2a83a; border-radius: 8px; padding: 2px 7px;
    margin-top: 2px; white-space: nowrap;
  }
  /* 편집 모드 - 바로 수정하는 칸 */
  li input.edit-cyc {
    flex: 0 0 78px; width: 78px; font-family: inherit; font-size: 11px; color: #5b5012;
    border: 1px solid #d8c64f; border-radius: 8px; background: #fffef0;
    padding: 3px 6px; margin-top: 1px;
  }
  li input.edit-name {
    flex: 1; min-width: 0; font-family: inherit; font-size: 14.5px; color: #3d3713;
    border: none; border-bottom: 1.5px solid #d8c64f; background: transparent; padding: 3px 2px;
  }
  li input.edit-cyc:focus, li input.edit-name:focus { outline: none; border-color: #8aa35a; }
  li.done { opacity: .35; }
  li.done .txt { text-decoration: line-through; }
  li.done .box { background: #b9a83e; }
  /* 편집 모드용 버튼 */
  li .mini {
    flex: 0 0 auto; border: none; background: transparent;
    font-size: 16px; cursor: pointer; padding: 0 3px; line-height: 1.3;
  }
  .add-row {
    display: none; align-items: center; gap: 6px; padding: 8px 2px 2px;
  }
  .editing .add-row { display: flex; }
  .add-row input {
    flex: 1; font-family: inherit; font-size: 14px; padding: 6px 8px;
    border: 1.5px solid #c9b94e; border-radius: 6px; background: #fffef0; color: #3d3713;
  }
  .add-row #addCyc { flex: 0 0 60px; width: 60px; text-align: center; }
  .add-row button {
    border: none; background: #7bc47f; color: #163d18; font-weight: 800;
    font-family: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
  }
  .empty { font-size: 13px; color: #a79a5e; padding: 8px 2px; font-style: italic; }
  .footer {
    margin-top: 18px; display: flex; justify-content: space-between;
    align-items: center; font-size: 12px; color: #8a7f4a;
  }
  .reset {
    border: none; background: #e9d873; color: #5b5012;
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 12px; border-radius: 14px; cursor: pointer;
  }
  .reset:active { background: #ddc94f; }
  .count { font-weight: 800; color: #6b6029; }
  .hint { font-size: 11px; color: #a8993f; margin-top: 6px; display: none; }
  .editing .hint { display: block; }
</style>
</head>
<body>
<div class="note" id="note">
  <h1>📝 오늘 할일 <button class="edit-btn" id="editBtn">✏️ 편집</button></h1>
  <div class="date" id="date"></div>

  <div class="sec-title">📌 내 담당업무</div>
  <ul id="own"></ul>
  <div class="add-row">
    <input id="addCyc" type="text" placeholder="주기">
    <input id="addInput" type="text" placeholder="새 담당업무 이름">
    <button id="addBtn">+ 추가</button>
  </div>

  <div class="sec-title toggle" id="bakTitle">
    <span class="arrow">▶</span> 🤝 내 대무업무 <span id="bakCount" style="font-weight:600;color:#a8993f;"></span>
  </div>
  <ul id="bak" class="collapsed"></ul>

  <div class="hint">✏️ 편집 중: 칸 안에서 바로 수정 (앞=주기, 뒤=업무명) · 🗑️ 삭제 · 맨 아래 칸에서 추가</div>

  <div class="footer">
    <span>한 건 누르면 지워져요 · 매일 아침 다시 채워짐</span>
    <button class="reset" id="reset">전체 되돌리기</button>
  </div>
</div>

<script>
/* ===== 기본 업무 목록 (처음 한 번만 사용, 이후엔 편집한 내용이 저장돼서 보임) ===== */
const DEFAULT_TASKS = [
  { id:"d1",  task:"물류", owner:"고지원", backup:"서영민", cyc:"매일" },
  { id:"d2",  task:"요금제 하향 확인 M+3", owner:"김한아", backup:"", cyc:"매월 05일" },
  { id:"d3",  task:"세금계산서 완료여부 확인", owner:"김한아", backup:"", cyc:"매월 말일" },
  { id:"d4",  task:"<20일 이전> 계산서 및 정산금", owner:"김한아", backup:"", cyc:"매월 25일" },
  { id:"d5",  task:"시장단가 접수", owner:"김한아", backup:"", cyc:"매일 오전" },
  { id:"d6",  task:"거래처 정보 등록", owner:"김한아", backup:"", cyc:"" },
  { id:"d7",  task:"[무선] SK 정책 전달", owner:"김한아", backup:"", cyc:"" },
  { id:"d8",  task:"[무선] SK 시장단가 카톡전달", owner:"김한아", backup:"서영민", cyc:"매일 오전" },
  { id:"d9",  task:"올케어 관리", owner:"서영민", backup:"김한아", cyc:"" },
  { id:"d10", task:"SKT 유선 영업 업데이트 현황", owner:"서영민", backup:"", cyc:"매일 오전" },
  { id:"d11", task:"공시지원금 변동 확인", owner:"서영민", backup:"", cyc:"매일" },
  { id:"d12", task:"판매점 포탈", owner:"서영민", backup:"김한아", cyc:"매일 출근후" },
  { id:"d13", task:"SK 유선 정산입력 (11시 전까지)", owner:"서영민", backup:"김한아", cyc:"매일 오전" },
  { id:"d14", task:"SK 무선 기기접수 정산입력 (11시까지)", owner:"서영민", backup:"김한아", cyc:"" },
  { id:"d15", task:"<25-27일> 동탄 기기 미개통 확인", owner:"서영민", backup:"", cyc:"매월 27일" },
  { id:"d16", task:"웹 접수 등록 (유선) + 유선정산 시트입력", owner:"서영민", backup:"김한아", cyc:"" },
  { id:"d17", task:"[무선] 정산시트 정책금액 확인", owner:"서영민", backup:"", cyc:"매일" },
  { id:"d18", task:"[무선] 서비스 관련 반영", owner:"서영민", backup:"김한아", cyc:"매일 오전" },
  { id:"d19", task:"[무선] SK 무선 기기개통 정산입력", owner:"서영민", backup:"김한아", cyc:"매일 오전" },
  { id:"d20", task:"[무선] 개통확인", owner:"서영민", backup:"김한아", cyc:"매일 오후" },
  { id:"d21", task:"웹 접수 등록 (무선)", owner:"서영민", backup:"김한아", cyc:"" },
  { id:"d22", task:"[무선] KT 비대면 데이터 개통 리스트", owner:"서영민", backup:"", cyc:"매월" },
  { id:"d23", task:"[무선] KT 재고현황 카톡전달 (BMT)", owner:"서영민", backup:"김한아", cyc:"매일 오전" },
];

/* ===== 업무 목록 저장/불러오기 (편집 내용 보관) ===== */
function loadTasks(){
  try {
    const raw = localStorage.getItem("todoTasks");
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return DEFAULT_TASKS.map(t => ({...t}));
}
function saveTasks(){ localStorage.setItem("todoTasks", JSON.stringify(tasks)); }

/* ===== 날짜 (오늘) ===== */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const WEEK = ["일","월","화","수","목","금","토"];
function todayLabel(){
  const d = new Date();
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`;
}

/* ===== 완료 상태 저장 (매일 리셋) ===== */
function loadDone(){
  try {
    const raw = JSON.parse(localStorage.getItem("todoDone") || "{}");
    if (raw.date !== todayStr()) return {};
    return raw.items || {};
  } catch(e){ return {}; }
}
function saveDone(){ localStorage.setItem("todoDone", JSON.stringify({ date: todayStr(), items: done })); }

let tasks = loadTasks();
let done = loadDone();
const me = "김한아";
let editMode = false;

const $note = document.getElementById("note");
const $own = document.getElementById("own");
const $bak = document.getElementById("bak");
const $bakTitle = document.getElementById("bakTitle");
const $bakCount = document.getElementById("bakCount");
const $editBtn = document.getElementById("editBtn");
document.getElementById("date").textContent = todayLabel();

function makeLi(t){
  const li = document.createElement("li");
  if (done[t.id]) li.classList.add("done");

  if (editMode) {
    li.style.cursor = "default";

    // 주기 칸 (맨 앞) — 바로 수정, 비우면 배지 없음
    const cycI = document.createElement("input");
    cycI.className = "edit-cyc"; cycI.value = t.cyc; cycI.placeholder = "주기";
    cycI.addEventListener("input", () => { t.cyc = cycI.value; });
    cycI.addEventListener("blur", () => { t.cyc = cycI.value.trim(); saveTasks(); });
    cycI.addEventListener("keydown", e => { if (e.key === "Enter") cycI.blur(); });

    // 업무 이름 칸 — 바로 수정
    const nameI = document.createElement("input");
    nameI.className = "edit-name"; nameI.value = t.task;
    nameI.addEventListener("input", () => { t.task = nameI.value; });
    nameI.addEventListener("blur", () => { if (nameI.value.trim()) t.task = nameI.value.trim(); else nameI.value = t.task; saveTasks(); });
    nameI.addEventListener("keydown", e => { if (e.key === "Enter") nameI.blur(); });

    // 삭제
    const del = document.createElement("button");
    del.className = "mini del"; del.textContent = "🗑️"; del.title = "삭제";
    del.onclick = () => deleteTask(t);

    li.appendChild(cycI);
    li.appendChild(nameI);
    li.appendChild(del);
  } else {
    const cyc = t.cyc ? `<span class="cyc">${t.cyc}</span>` : "";
    li.innerHTML = `<span class="box">${done[t.id] ? "✓" : ""}</span>` +
                   cyc +
                   `<span class="txt">${t.task}</span>`;
    li.onclick = () => {
      if (done[t.id]) delete done[t.id]; else done[t.id] = true;
      saveDone(); render();
    };
  }
  return li;
}
function deleteTask(t){
  if (confirm(`'${t.task}'\n이 업무를 삭제할까요?`)) {
    tasks = tasks.filter(x => x.id !== t.id);
    delete done[t.id];
    saveTasks(); saveDone(); render();
  }
}
function addTask(){
  const inp = document.getElementById("addInput");
  const cycInp = document.getElementById("addCyc");
  const v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  tasks.push({ id: "u" + Date.now() + Math.floor(Math.random()*1000), task: v, owner: me, backup: "", cyc: cycInp.value.trim() });
  inp.value = ""; cycInp.value = "";
  saveTasks(); render();
}

function render(){
  $own.innerHTML = ""; $bak.innerHTML = "";

  const own = tasks.filter(t => t.owner === me);
  const bak = tasks.filter(t => t.backup === me);
  const order = arr => arr.slice().sort((a,b)=> (done[a.id]?1:0) - (done[b.id]?1:0));

  if (own.length) order(own).forEach(t => $own.appendChild(makeLi(t)));
  else $own.innerHTML = '<div class="empty">담당업무 없음</div>';

  if (bak.length) order(bak).forEach(t => $bak.appendChild(makeLi(t)));
  else $bak.innerHTML = '<div class="empty">대무업무 없음</div>';

  const bakLeft = bak.filter(t => !done[t.id]).length;
  $bakCount.textContent = bak.length ? `(${bakLeft}/${bak.length})` : "";
}

/* 대무업무 접기/펴기 */
$bakTitle.onclick = () => {
  const collapsed = $bak.classList.toggle("collapsed");
  $bakTitle.classList.toggle("open", !collapsed);
};

/* 편집 모드 켜고 끄기 */
$editBtn.onclick = () => {
  if (editMode && document.activeElement) document.activeElement.blur(); // 수정 중이던 값 저장
  editMode = !editMode;
  $note.classList.toggle("editing", editMode);
  $editBtn.textContent = editMode ? "✅ 완료" : "✏️ 편집";
  saveTasks();
  render();
};

document.getElementById("addBtn").onclick = addTask;
document.getElementById("addInput").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
document.getElementById("addCyc").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("addInput").focus(); });

document.getElementById("reset").onclick = () => { done = {}; saveDone(); render(); };

render();
</script>
</body>
</html>
